<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Panely Ink - Adaptive Icon Monochrome Layer -->
  <!-- Used for Material You themed icons (Android 13+). System tints this stencil. -->
  <!-- Untouched pixels = OS background color. Filled pixels = OS foreground tint. -->

  <!-- Back panel: filled silhouette (anchors the stack) -->
  <rect
    x="290"
    y="315"
    width="285"
    height="375"
    rx="35"
    transform="rotate(-7 290 315)"
    fill="#000000"
  />

  <!-- Middle panel: outline only -->
  <rect
    x="342"
    y="295"
    width="293"
    height="390"
    rx="38"
    transform="rotate(4 342 295)"
    fill="none"
    stroke="#000000"
    stroke-width="36"
  />

  <!-- Front panel: outline only -->
  <rect
    x="370"
    y="325"
    width="314"
    height="375"
    rx="40"
    fill="none"
    stroke="#000000"
    stroke-width="40"
  />

  <!-- Comic panels: filled (give visual weight to the front cover) -->
  <rect x="406" y="361" width="112" height="142" rx="20" fill="#000000"/>
  <rect x="536" y="361" width="112" height="70"  rx="18" fill="#000000"/>
  <rect x="536" y="449" width="112" height="131" rx="20" fill="#000000"/>
  <rect x="406" y="521" width="112" height="142" rx="20" fill="#000000"/>
  <rect x="536" y="598" width="112" height="66"  rx="18" fill="#000000"/>
</svg>
