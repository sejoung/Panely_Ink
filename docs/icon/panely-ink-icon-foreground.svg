<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Panely Ink - Adaptive Icon Foreground Layer -->
  <!-- Content sits within the 66/108 safe zone (center 626x626 = x:199-825, y:199-825) -->
  <!-- Stroke widths bumped from the standalone icon for legibility at 48dp launcher size -->

  <!-- Back panel (solid, rotated -7) -->
  <rect
    x="290"
    y="315"
    width="285"
    height="375"
    rx="35"
    transform="rotate(-7 290 315)"
    fill="#111111"
  />

  <!-- Middle panel (outlined, rotated +4) -->
  <rect
    x="342"
    y="295"
    width="293"
    height="390"
    rx="38"
    transform="rotate(4 342 295)"
    fill="#FFFFFF"
    stroke="#111111"
    stroke-width="36"
  />

  <!-- Front panel (outlined, no rotation) -->
  <rect
    x="370"
    y="325"
    width="314"
    height="375"
    rx="40"
    fill="#FFFFFF"
    stroke="#111111"
    stroke-width="40"
  />

  <!-- Comic panels on front cover -->
  <rect x="406" y="361" width="112" height="142" rx="20" fill="#111111"/>
  <rect x="536" y="361" width="112" height="70"  rx="18" fill="#111111"/>
  <rect x="536" y="449" width="112" height="131" rx="20" fill="#111111"/>
  <rect x="406" y="521" width="112" height="142" rx="20" fill="#111111"/>
  <rect x="536" y="598" width="112" height="66"  rx="18" fill="#111111"/>
</svg>
